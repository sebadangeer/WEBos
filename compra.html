<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar - Sneakers Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg custom-nav" style="background-color: #ffffff !important;">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img src="img/Gemini_Generated_Image_8lcyk68lcyk68lcy.jpg" alt="Logo" height="60" class="d-inline-block align-text-top me-3">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-2">
            <li class="nav-item"><a class="nav-link custom-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link custom-link" href="contacto.html">Contacto</a></li>
            <li class="nav-item"><a class="nav-link custom-link" href="pagina2.html">pagina2</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- FORMULARIO DE PEDIDO -->
    <div class="checkout-container">
        <h2>FINALIZAR PEDIDO</h2>
        
        <form action="#" method="POST" class="order-form">
            
            <!-- SELECCIÓN DE TALLA EN CUADRADOS -->
            <div class="form-group">
                <label class="section-title">SELECCIONA TU TALLA (US):</label>
                <div class="size-picker">
                    <input type="radio" name="size" id="size-8" value="8" required>
                    <label for="size-8">8</label>

                    <input type="radio" name="size" id="size-85" value="8.5" required>
                    <label for="size-85">8.5</label>

                    <input type="radio" name="size" id="size-9" value="9" required>
                    <label for="size-9">9</label>

                    <input type="radio" name="size" id="size-95" value="9.5" required>
                    <label for="size-95">9.5</label>

                    <input type="radio" name="size" id="size-10" value="10" required>
                    <label for="size-10">10</label>

                    <input type="radio" name="size" id="size-105" value="10.5" required>
                    <label for="size-105">10.5</label>

                    <input type="radio" name="size" id="size-11" value="11" required>
                    <label for="size-11">11</label>

                    <input type="radio" name="size" id="size-115" value="11.5" required>
                    <label for="size-115">11.5</label>

                    <input type="radio" name="size" id="size-12" value="12" required>
                    <label for="size-12">12</label>
                </div>
            </div>

            <!-- DATOS PERSONALES -->
            <div class="form-group">
                <label for="nombre">Nombre y Apellido *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Michael Jordan" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico *</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono *</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: +56912345678" pattern="[0-9+ ]+" required>
            </div>

            <button type="submit" class="btn-buy">CONFIRMAR PEDIDO</button>
        </form>

        <!-- BOTÓN PARA VOLVER ATRÁS -->
        <div class="text-center mt-3">
            <button onclick="history.back()" class="btn-back">← Volver atrás</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
