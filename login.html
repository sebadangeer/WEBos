<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sneakers Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="main-wrapper">
        
        <!-- LOGO Y NOMBRE SUPERIOR -->
        <div class="brand-header">
            <div class="brand-logo-box">
                <svg viewBox="0 0 100 60" preserveAspectRatio="none">
                    <line x1="0" y1="0" x2="100" y2="60" stroke="#ffffff" stroke-width="2"/>
                    <line x1="100" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-width="2"/>
                </svg>
            </div>
            <h1 class="brand-name">nombre empresa</h1>
        </div>

        <!-- TARJETA DE INICIO DE SESIÓN -->
        <div class="custom-card">
            <h2 class="form-title">INICIO DE SESIÓN</h2>
            <form id="form-login">
            <div class="field-group">
                <label for="correo">CORREO</label>
                <input type="email" id="correo" class="custom-input" required>
            </div>

            <div class="field-group">
                <label for="password">CONTRASEÑA</label>
                <input type="password" id="password" class="custom-input" required>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn-red-submit">INICIAR SESIÓN</button>
                <!-- BOTÓN VOLVER ATRÁS -->
                <a href="acceso.html" class="btn-back">← VOLVER ATRÁS</a>
            </div>
            </form>
        </div>

    </div>
<script src="js/login.js"></script>
</body>
</html>
