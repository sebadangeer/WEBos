<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sneakers Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="main-wrapper">
        
        <!-- LOGO Y NOMBRE SUPERIOR -->
        <div class="brand-header">
            <div class="brand-logo-box">
                <svg viewBox="0 0 100 60" preserveAspectRatio="none">
                    <line x1="0" y1="0" x2="100" y2="60" stroke="#ffffff" stroke-width="2"/>
                    <line x1="100" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-width="2"/>
                </svg>
            </div>
            <h1 class="brand-name">nombre empresa</h1>
        </div>

        <!-- TARJETA DE INICIO DE SESIÓN -->
        <div class="custom-card">
            <h2 class="form-title">INICIO DE SESIÓN</h2>
            <form id="form-login">
            <div class="field-group">
                <label for="correo">CORREO</label>
                <input type="email" id="correo" class="custom-input" placeholder="usuario@dominio.com" required>
            </div>

            <div class="field-group">
                <label for="password">CONTRASEÑA</label>
                <input type="password" id="password" class="custom-input" placeholder="••••••••" required>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn-red-submit">INICIAR SESIÓN</button>
                <!-- BOTÓN VOLVER ATRÁS -->
                <a href="acceso.html" class="btn-back">← VOLVER ATRÁS</a>
            </div>
            </form>
        </div>

    </div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
    const formLogin = document.getElementById('form-login');

    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();

        // 1. Obtener los valores de los inputs
        const correo = document.getElementById('correo').value.trim();
        const password = document.getElementById('password').value;

        // 2. Estructurar el DTO de Login esperado por el backend
        const credentials = {
            email: correo,
            contrasena: password
        };

        try {
            // 3. Petición POST al endpoint de login
            const response = await fetch('http://localhost:8080/api/clientes/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(credentials)
            });

            // 4. Procesar la respuesta
            if (response.ok) {
                const cliente = await response.json();
                
                // Guardar la sesión en localStorage
                localStorage.setItem('usuarioSesion', JSON.stringify(cliente));

                alert(`¡Bienvenido/a, ${cliente.pnombre}!`);
                
                // Redirigir al inicio/dashboard
                window.location.href = 'index.html';
            } else {
                const errorMsg = await response.text();
                alert('No se pudo iniciar sesión: ' + errorMsg);
            }
        } catch (error) {
            console.error('Error de red/servidor:', error);
            alert('Ocurrió un error al conectar con el servidor. Revisa si Spring Boot está activo.');
        }
    });
});
</script>
</body>
</html>
