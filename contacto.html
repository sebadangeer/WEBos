<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Sneakers Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>

    <!-- BARRA SUPERIOR DE NAVEGACIÓN -->
    <nav class="top-navbar">
        <a href="#" class="nav-brand">■ Site Name</a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li>|</li>
            <li><a href="#">Productos</a></li>
            <li>|</li>
            <li><a href="#">Nosotros</a></li>
            <li>|</li>
            <li><a href="#">Blogs</a></li>
            <li>|</li>
            <li><a href="#" class="active">Contacto</a></li>
        </ul>
        <a href="#" class="nav-cart">🛒 Cart (0)</a>
    </nav>

    <div class="main-wrapper">
        
        <!-- LOGO Y NOMBRE SUPERIOR -->
        <div class="brand-header">
            <div class="brand-logo-box">
                <svg viewBox="0 0 100 60" preserveAspectRatio="none">
                    <line x1="0" y1="0" x2="100" y2="60" stroke="#ffffff" stroke-width="2"/>
                    <line x1="100" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-width="2"/>
                </svg>
            </div>
            <h1 class="brand-name">FACTURE SNEAKERS</h1>
        </div>

        <!-- TARJETA DEL FORMULARIO DE CONTACTO -->
        <div class="custom-card">
            <h2 class="form-title">FORMULARIO DE CONTACTOS</h2>

            <form id="form-contacto">
                
                <div class="field-group">
                    <label for="nombre">NOMBRE COMPLETO</label>
                    <input type="text" id="nombre" class="custom-input" placeholder="Tu nombre completo" required>
                </div>

                <div class="field-group">
                    <label for="correo">CORREO</label>
                    <input type="email" id="correo" class="custom-input" placeholder="usuario@dominio.com" required>
                </div>

                <div class="field-group">
                    <label for="contenido">CONTENIDO</label>
                    <textarea id="contenido" class="custom-textarea" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn-red-submit">ENVIAR MENSAJE</button>
                </div>

            </form>
        </div>

    </div>

    <!-- Tu código HTML anterior se mantiene igual arriba de esto -->

    <script>
        document.getElementById('form-contacto').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue al enviar el formulario
            
            // Obtenemos los valores de los inputs
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const contenido = document.getElementById('contenido').value;
            
            // Correo de destino
            const destinatario = "se.balladares@duocuc.cl";
            
            // Asunto predeterminado
            const asunto = encodeURIComponent("Nuevo contacto desde Sneakers Store");
            
            // Cuerpo del correo con los datos del usuario
            const cuerpo = encodeURIComponent(
                "Nombre: " + nombre + "\n" +
                "Correo de contacto: " + correo + "\n\n" +
                "Mensaje:\n" + contenido
            );
            
            // URL mágica que abre la versión web de Gmail para redactar el correo
            const urlGmail = `https://mail.google.com/mail/?view=cm&fs=1&to=${destinatario}&su=${asunto}&body=${cuerpo}`;
            
            // Abrir Gmail en una nueva pestaña
            window.open(urlGmail, '_blank');
        });
    </script>
</body>
</html>
</body>
</html>
