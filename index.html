<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tus estilos personalizados CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Estilos CSS para el fondo de pantalla y transición suave -->
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            /* Propiedades para que la imagen de fondo cubra toda la pantalla correctamente */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.6s ease-in-out; /* Transición más fluida al cambiar */
        }

        /* Contenedor exclusivo para la barra de navegación para aislarla del fondo general */
        .nav-container {
            width: 100%;
        }

        .brand-card {
            transition: transform 0.3s ease;
        }
        
        /* Pequeño efecto visual al pasar el cursor por la tarjeta */
        .brand-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body id="page-body" style="background-image: url('img/620e1b32aeecf.r_d.583-284-0.jpeg');"> 
    <!-- Fondo predeterminado inicial al cargar la página -->

    <!-- CONTENEDOR DE LA BARRA DE NAVEGACIÓN -->
    <div class="nav-container">
        <!-- SECCIÓN: MENÚ DE NAVEGACIÓN -->
        <nav class="navbar navbar-expand-lg navbar-light custom-nav">
          <div class="container-fluid">
            <!-- Logo de la marca -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
              <img src="img/Gemini_Generated_Image_8lcyk68lcyk68lcy.jpg" alt="Logo" height="60" class="d-inline-block align-text-top me-3">
            </a>
            <!-- Botón para menú responsive en dispositivos móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Enlaces del menú de navegación -->
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav ms-2">
                <li class="nav-item">
                  <a class="nav-link custom-link" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link custom-link" href="contacto.html">Contacto</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link custom-link" href="pagina2.html">pagina2</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
    </div>

    <!-- SECCIÓN DE BRAND CARDS (ESTILO CHICAGO BULLS) -->
    <div class="container my-5">
      <h2 class="text-center mb-4 fw-bold text-white">Nuestras <span class="text-bulls-red">Marcas</span></h2>
      <div class="row g-4">
        
        <!-- Tarjeta 1: Nike -->
        <div class="col-md-4">
          <div class="card brand-card bg-bulls-dark text-white h-100 shadow" data-bg="img/urbano.webp">
            <div class="card-body text-center d-flex flex-column justify-content-between">
              <div>
                <h3 class="card-title fw-bold text-bulls-red">NIKE</h3>
                <img src="https://static.vecteezy.com/system/resources/previews/014/414/661/non_2x/nike-swoosh-logo-on-transparent-background-free-vector.jpg" alt="Logo Nike" class="img-fluid">
              </div>
              <a href="#" class="btn btn-bulls mt-3">Ver Colección</a>
            </div>
          </div>
        </div>

        <!-- Tarjeta 2: Nike Sports -->
        <div class="col-md-4">
          <div class="card brand-card bg-bulls-dark text-white h-100 shadow" data-bg="img/run.avif">
            <div class="card-body text-center d-flex flex-column justify-content-between">
              <div>
                <h3 class="card-title fw-bold text-bulls-red">NIKE SPORTS</h3>
                <img src="img/nikesportswear.jpg" alt="Logo Nike Sports" class="img-fluid">
              </div>
              <a href="nike.sports.html" class="btn btn-bulls mt-3">Ver Colección</a>
            </div>
          </div>
        </div>

        <!-- Tarjeta 3: Jordan -->
        <div class="col-md-4">
          <div class="card brand-card bg-bulls-dark text-white h-100 shadow" data-bg="img/michael-jordan-1587661339.avif">
            <div class="card-body text-center d-flex flex-column justify-content-between">
              <div>
                <h3 class="card-title fw-bold text-bulls-red">JORDAN</h3>
                <img src="https://static.vecteezy.com/system/resources/previews/014/414/668/non_2x/air-jordan-jumpman-logo-on-transparent-background-free-vector.jpg" alt="Logo Jordan" class="img-fluid">
              </div>
              <a href="jordan.html" class="btn btn-bulls mt-3">Ver Colección</a>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- SCRIPT PARA CAMBIAR EL FONDO AL PASAR EL MOUSE POR LAS TARJETAS -->
    <script>
        const cards = document.querySelectorAll('.brand-card');
        const body = document.getElementById('page-body');
        
        // Guardamos el fondo por defecto para cuando el mouse salga de las tarjetas
        const defaultBackground = body.style.backgroundImage;

        cards.forEach(card => {
            // Cuando el cursor entra a la tarjeta
            card.addEventListener('mouseenter', function() {
                const bgImage = this.getAttribute('data-bg');
                if (bgImage) {
                    body.style.backgroundImage = `url('${bgImage}')`;
                }
            });

            // Cuando el cursor sale de la tarjeta
            card.addEventListener('mouseleave', function() {
                body.style.backgroundImage = defaultBackground;
            });
        });
    </script>
</body>
</html>
