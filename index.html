</head>
<body id="page-body" style="background-image: url('img/620e1b32aeecf.r_d.583-284-0.jpeg');"> 

    <!-- CONTENEDOR DE LA BARRA DE NAVEGACIÓN -->

        <nav class="navbar navbar-expand-lg navbar-light custom-nav">
          <div class="container-fluid">
            <!-- Logo de la marca -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
              <img src="img/logo/logoo.png" alt="Logo" class="d-inline-block align-text-top me-3">
            </a>
            <!-- Botón para menú responsive en dispositivos móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Enlaces del menú de navegación -->
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav ms-2">
                <li class="nav-item">
                  <a class="nav-link custom-link" href="portada.html">Inicio</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link custom-link" href="nosotros.html">Nosotros</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link custom-link" href="contacto.html">Contacto</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link custom-link" href="acceso.html">Iniciar sesion</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
    </div>

    <!-- SECCIÓN DE BRAND CARDS -->
    <div class="container my-5 text-center">
        <h2 class="titulo-banner-marcas">
          Selecciona <span class="text-bulls-red">Cual</span> de <span class="text-bulls-red">Nuestras</span> Marcas <span class="text-bulls-red">Quieres</span> Ver
        </h2>
        
        <div class="row g-4">
            <!-- Tarjeta 1: Nike -->
            <div class="col-md-4">
              <div class="card brand-card bg-bulls-dark text-white h-100 shadow" data-bg="img/urbano.webp">
                <div class="card-body text-center d-flex flex-column justify-content-between">
                  <div>
                    <h3 class="card-title fw-bold text-bulls-red mb-3">NIKE</h3>
                    <img src="https://static.vecteezy.com/system/resources/previews/014/414/661/non_2x/nike-swoosh-logo-on-transparent-background-free-vector.jpg" alt="Logo Nike" class="img-fluid">
                  </div>
                  <a href="nike.html" class="btn btn-bulls mt-3">Ver Colección</a>
                </div>
              </div>
            </div>

            <!-- Tarjeta 2: Nike Sports -->
            <div class="col-md-4">
              <div class="card brand-card bg-bulls-dark text-white h-100 shadow" data-bg="img/run.avif">
                <div class="card-body text-center d-flex flex-column justify-content-between">
                  <div>
                    <h3 class="card-title fw-bold text-bulls-red mb-3">NIKE SPORTS</h3>
                    <img src="img/logo/sport.jpg" alt="Logo Nike Sports" class="img-fluid">
                  </div>
                  <a href="nike.sports.html" class="btn btn-bulls mt-3">Ver Colección</a>
                </div>
              </div>
            </div>

            <!-- Tarjeta 3: Jordan -->
            <div class="col-md-4">
              <div class="card brand-card bg-bulls-dark text-white h-100 shadow" data-bg="img/logo/log4k.jpg">
                <div class="card-body text-center d-flex flex-column justify-content-between">
                  <div>
                    <h3 class="card-title fw-bold text-bulls-red mb-3">JORDAN</h3>
                    <img src="img/logo/ljordan.jpg" alt="Logo Jordan" class="img-fluid">
                  </div>
                  <a href="jordan.html" class="btn btn-bulls mt-3">Ver Colección</a>
                </div>
              </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT PARA CAMBIAR EL FONDO AL PASAR EL MOUSE -->
    <script>
      const cards = document.querySelectorAll('.brand-card');
      const body = document.getElementById('page-body');
      const defaultBackground = "url('img/logo/log4k.jpg')";

      // Establecer el fondo por defecto en mosaico
      body.style.backgroundImage = defaultBackground;
      body.style.backgroundSize = '680px';
      body.style.backgroundRepeat = 'repeat';

      cards.forEach(card => {
        card.addEventListener('mouseenter', function() {
            const bgImage = this.getAttribute('data-bg');
            if (bgImage) {
                body.style.backgroundImage = `url('${bgImage}')`;
                // Configuración de mosaico idéntica para todas las tarjetas
                body.style.backgroundSize = '280px';
                body.style.backgroundRepeat = 'repeat';
            }
        });

        card.addEventListener('mouseleave', function() {
            body.style.backgroundImage = defaultBackground;
            body.style.backgroundSize = '280px';
            body.style.backgroundRepeat = 'repeat';
            });
          });
      </script>
</body>
</html>
