<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial - Sneakers Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/blogs.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand text-uppercase fw-bold" href="#">
                <span class="text-bulls-red">■</span> FACTURE SNEAKERS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link text-bulls-red active" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="editorial-header">
        <h1>THE SNEAKER EDITORIAL</h1>
        <p>Cultura, lanzamientos y la historia detrás de cada par.</p>
    </div>

    <div class="editorial-container" id="blogs-container">
        <div class="loading-box text-center" id="cargando-mensaje">
            <div class="spinner-border text-bulls-red mb-3" role="status"></div>
            <h3>Cargando los últimos artículos...</h3>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarBlogs();
        });

        async function cargarBlogs() {
            const urlAPI = 'http://localhost:8080/api/blogs'; 
            
            try {
                const response = await fetch(urlAPI);
                if (!response.ok) throw new Error('Error en la respuesta');
                
                const blogs = await response.json();
                const container = document.getElementById('blogs-container');
                container.innerHTML = ''; 

                if (blogs.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h2>No hay artículos publicados</h2>
                            <p>El equipo editorial está preparando nuevo contenido.</p>
                        </div>`;
                    return;
                }

                blogs.forEach(blog => {
                    const imagenUrl = blog.link_imagen_post || 'https://images.unsplash.com/photo-1514989940723-e8e51635b782?auto=format&fit=crop&w=800&q=80';
                    
                    const postHTML = `
                        <article class="news-card">
                            <div class="news-image-wrapper">
                                <img src="${imagenUrl}" alt="${blog.nombre_post}" loading="lazy">
                                <div class="news-category">LATEST DROP</div>
                            </div>
                            
                            <div class="news-content">
                                <span class="news-meta">POST #${blog.id_posteo} &nbsp;•&nbsp; 5 MIN READ</span>
                                <h2 class="news-title">${blog.nombre_post}</h2>
                                <p class="news-excerpt">${blog.descripcion_post}</p>
                                
                                <button class="news-btn" onclick="verPost(${blog.id_posteo})">
                                    LEER ARTÍCULO <span class="arrow">→</span>
                                </button>
                            </div>
                        </article>
                    `;
                    container.innerHTML += postHTML;
                });

            } catch (error) {
                console.error("Error al cargar:", error);
                document.getElementById('blogs-container').innerHTML = `
                    <div class="error-box">
                        <h3>Error de conexión</h3>
                        <p>No pudimos cargar los artículos. Verifica que el servidor (Spring Boot) esté activo en el puerto 8080.</p>
                    </div>
                `;
            }
        }

        function verPost(id) {
            alert("Accediendo al artículo de fondo. ID: " + id);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
